; AstroVital wearable firmware: ESP32 DevKit + MAX30102 (pulse, SpO2) + DS18B20 (temperature).
;
;   pip install platformio
;   pio run -d firmware                 build
;   pio run -d firmware -t upload       flash (some boards need BOOT held while uploading)
;   pio device monitor -b 115200        serial console (type `status`)
;   pio test -d firmware -e native      pure-logic tests (needs a host C++ compiler)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@1.1.2
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@4.0.5
    bblanchon/ArduinoJson@7.4.3

; Pure-logic unit tests (finger hysteresis, median filter, queue overflow, backoff) on the host.
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<finger_detect.cpp> +<signal_quality.cpp> +<frame_queue.cpp>
build_flags = -std=c++17 -DUNIT_TEST

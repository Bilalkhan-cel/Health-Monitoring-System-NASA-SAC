<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="static-root" content="{{ url_for('static', filename='') }}">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>{% block title %}AstroVital{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
  <link rel="preload" href="{{ url_for('static', filename='vendor/fonts/geist-latin-wght-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% block body %}
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-foot">
    {% block footer %}Prototype for educational purposes. Not a certified medical device.{% endblock %}
  </footer>
  {% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
